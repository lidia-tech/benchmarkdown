name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (all extractor + metric groups)
        run: uv sync --all-groups

      # The suite runs under pytest. Integration tests (@pytest.mark.integration)
      # need live API credentials, a running app, or a browser; they are
      # deselected by default via `addopts = "-m 'not integration'"` in
      # pyproject.toml, so a bare `pytest` run is the offline unit suite.
      - name: Run tests
        run: uv run pytest
